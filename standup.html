<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>standup</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── PAPER ──────────────────────────────────────────────
     Ink on paper, not a HUD. Nothing is pure black or pure
     white; that is most of what keeps it calm.                */
  :root {
    --paper:      #f7f2e8;
    --paper-deep: #efe8db;
    --panel:      #fffdf8;
    --ink:        #2a2622;
    --ink-soft:   #7a7168;
    --ink-faint:  #b8ada0;
    --rule:       rgba(42,38,34,0.18);
    --shadow:     rgba(42,38,34,0.16);
    --dot:        rgba(42,38,34,0.055);

    --tag-progress: #2f9c8b;  --tag-progress-tint: #dcefeb;
    --tag-ai:       #5f74cc;  --tag-ai-tint:       #e0e4f6;
    --tag-gap:      #c4761f;  --tag-gap-tint:      #f6e6d4;
    --tag-values:   #cc6b86;  --tag-values-tint:   #f7e2e7;
    --tag-next:     #8a6fc0;  --tag-next-tint:     #eae2f6;

    --font-hand: 'Shantell Sans', 'Comic Sans MS', cursive;
    --font-body: 'Nunito', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  /* Night ink. Guarded so an explicit light choice still wins. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #17161a;
      --paper-deep: #101014;
      --panel:      #201f24;
      --ink:        #ece7dd;
      --ink-soft:   #9a938a;
      --ink-faint:  #5d5751;
      --rule:       rgba(236,231,221,0.20);
      /* Solid, not alpha: the printed offset has to stay readable against a
         near-black page, and a translucent black over it does nothing. */
      --shadow:     #08070a;
      --dot:        rgba(236,231,221,0.05);

      --tag-progress: #4fc7b3;  --tag-progress-tint: #17332f;
      --tag-ai:       #8fa0f0;  --tag-ai-tint:       #1d2140;
      --tag-gap:      #f0a458;  --tag-gap-tint:      #3a2814;
      --tag-values:   #f090a6;  --tag-values-tint:   #3a1e26;
      --tag-next:     #b096e8;  --tag-next-tint:     #271d3c;
    }
  }
  /* Repeated so the in-page toggle wins in both directions. */
  :root[data-theme="dark"] {
    --paper:      #17161a;
    --paper-deep: #101014;
    --panel:      #201f24;
    --ink:        #ece7dd;
    --ink-soft:   #9a938a;
    --ink-faint:  #5d5751;
    --rule:       rgba(236,231,221,0.20);
    --shadow:     #08070a;
    --dot:        rgba(236,231,221,0.05);

    --tag-progress: #4fc7b3;  --tag-progress-tint: #17332f;
    --tag-ai:       #8fa0f0;  --tag-ai-tint:       #1d2140;
    --tag-gap:      #f0a458;  --tag-gap-tint:      #3a2814;
    --tag-values:   #f090a6;  --tag-values-tint:   #3a1e26;
    --tag-next:     #b096e8;  --tag-next-tint:     #271d3c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    /* Halftone, faint enough to read as paper grain rather than pattern. */
    background:
      radial-gradient(var(--dot) 1.2px, transparent 1.2px) 0 0 / 7px 7px,
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
    padding-bottom: 56px;
    -webkit-text-size-adjust: 100%;
  }

  /* ── HEADER ── */
  #header {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 16px 6px;
  }
  .wordmark {
    font-family: var(--font-hand);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #theme-btn {
    margin-left: auto;
    width: 38px; height: 38px;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    border-radius: 12px 14px 11px 13px;
  }

  /* ── WEEK NAVIGATOR ──
     The one control both tabs obey, so they can never disagree
     about which seven days are on screen.                       */
  #weeknav {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 720px;
    margin: 0 auto;
    padding: 4px 16px 10px;
  }
  .arrow {
    flex: none;
    width: 40px; height: 40px;
    padding: 0;
    font-size: 19px;
    line-height: 1;
    border-radius: 13px 11px 14px 12px;
  }
  #week-face { flex: 1; text-align: center; min-width: 0; }
  #week-name {
    font-family: var(--font-hand);
    font-size: 19px;
    font-weight: 600;
  }
  #week-sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  /* ── TABS ── */
  #tabs {
    display: flex;
    gap: 8px;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 14px;
  }
  .tab {
    flex: 1;
    font-family: var(--font-hand);
    font-size: 15px;
    font-weight: 600;
    padding: 9px 8px;
    text-align: center;
    color: var(--ink-soft);
    background: transparent;
    border: 2px solid var(--rule);
    border-radius: 14px 16px 13px 15px;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .tab.active {
    color: var(--paper);
    background: var(--ink);
    border-color: var(--ink);
    box-shadow: 2px 2px 0 var(--shadow);
  }

  main { padding: 0 16px; max-width: 720px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  /* ── PANELS ──
     Ink outline + a printed offset, in place of the old notches. */
  .panel {
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 18px 22px 16px 20px;
    box-shadow: 3px 3px 0 var(--shadow);
    padding: 16px;
    margin-bottom: 20px;
  }
  .panel.wob { border-radius: 21px 17px 22px 16px; }
  .panel h2 {
    font-family: var(--font-hand);
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  /* ── COMPOSER ── */
  textarea {
    display: block;
    width: 100%;
    min-height: 96px;
    background: var(--paper-deep);
    border: 2px solid var(--rule);
    border-radius: 14px 17px 13px 16px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding: 11px 13px;
    resize: vertical;
    transition: border-color 0.15s ease;
  }
  textarea::placeholder { color: var(--ink-faint); }
  textarea:focus { outline: none; border-color: var(--ink); }

  .stickers { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .sticker {
    font-family: var(--font-hand);
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 11px;
    border: 2px solid var(--ink-faint);
    border-radius: 999px;
    color: var(--ink-soft);
    background: transparent;
    cursor: pointer;
    user-select: none;
    transform: rotate(-1.5deg);
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .stickers .sticker:nth-child(even) { transform: rotate(1.2deg); }
  .sticker.on {
    color: var(--tag);
    background: var(--tag-tint);
    border-color: var(--tag);
    box-shadow: 2px 2px 0 var(--shadow);
  }

  /* Tag palette, shared by the pickers and the entry stickers. */
  .t-progress { --tag: var(--tag-progress); --tag-tint: var(--tag-progress-tint); }
  .t-ai       { --tag: var(--tag-ai);       --tag-tint: var(--tag-ai-tint); }
  .t-gap      { --tag: var(--tag-gap);      --tag-tint: var(--tag-gap-tint); }
  .t-values   { --tag: var(--tag-values);   --tag-tint: var(--tag-values-tint); }
  .t-next     { --tag: var(--tag-next);     --tag-tint: var(--tag-next-tint); }

  /* ── BUTTONS ──
     Pressing one physically moves it onto its own shadow.       */
  button {
    font-family: var(--font-hand);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 14px 16px 13px 15px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--shadow);
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
  }
  button:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--shadow);
  }
  button:disabled {
    opacity: 0.42;
    cursor: default;
    pointer-events: none;
    box-shadow: none;
  }
  button.primary { width: 100%; background: var(--ink); color: var(--paper); }
  button.quiet { border-color: var(--rule); color: var(--ink-soft); box-shadow: none; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }

  /* ── PAST-WEEK NOTE ──
     A note always saves with now(). Rather than blocking the main
     action behind an extra tap, say where it will land.          */
  #past-note {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  #past-note button { flex: none; font-size: 13px; padding: 5px 11px; }
  body.past #past-note { display: flex; }

  /* ── DAY CAPTION ── */
  .day {
    display: inline-block;
    font-family: var(--font-hand);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--paper-deep);
    border: 2px solid var(--ink);
    border-radius: 8px 10px 7px 9px;
    box-shadow: 2px 2px 0 var(--shadow);
    padding: 3px 10px;
    margin: 22px 0 16px;
    transform: rotate(-0.6deg);
  }
  #entries > .day:first-child { margin-top: 4px; }

  /* ── SPEECH BUBBLES ── */
  .entry { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 26px; }
  .bubble {
    position: relative;
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 16px 19px 15px 18px;
    box-shadow: 2px 2px 0 var(--shadow);
    padding: 11px 13px;
  }
  .entry:nth-child(even) .bubble { border-radius: 19px 15px 18px 16px; }
  /* The tail: an ink triangle with a slightly smaller paper one on top. */
  .bubble::before, .bubble::after {
    content: '';
    position: absolute;
    width: 0; height: 0;
    border-style: solid;
  }
  .bubble::before {
    bottom: -15px; left: 20px;
    border-width: 15px 13px 0 0;
    border-color: var(--ink) transparent transparent transparent;
  }
  .bubble::after {
    bottom: -11px; left: 23px;
    border-width: 11px 9px 0 0;
    border-color: var(--panel) transparent transparent transparent;
  }
  .bubble .txt { word-break: break-word; padding-right: 20px; }
  .bubble .del {
    position: absolute;
    top: 6px; right: 8px;
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1;
    color: var(--ink-faint);
    background: none;
    border: none;
    box-shadow: none;
    padding: 2px 4px;
    cursor: pointer;
  }
  .bubble .del:active { color: #c0392b; transform: none; }
  .entry .sticker {
    flex: none;
    margin-top: 9px;
    cursor: default;
    color: var(--tag);
    background: var(--tag-tint);
    border-color: var(--tag);
  }

  .empty {
    color: var(--ink-soft);
    font-family: var(--font-hand);
    font-size: 16px;
    text-align: center;
    padding: 26px 0;
  }

  /* ── DRAFT ── */
  .meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
  .meta b { color: var(--ink); font-weight: 600; }
  #draft-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    line-height: 1.65;
    background: var(--paper-deep);
    border: 2px solid var(--rule);
    border-radius: 14px 17px 13px 16px;
    padding: 14px;
    max-height: 56vh;
    overflow-y: auto;
  }
  #draft-text.note {
    color: var(--ink-soft);
    font-family: var(--font-hand);
    text-align: center;
    padding: 30px 14px;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(90px);
    font-family: var(--font-hand);
    font-size: 14px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px 16px 13px 15px;
    padding: 10px 18px;
    z-index: 500;
    max-width: 90vw;
    text-align: center;
    transition: transform 0.22s ease;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { background: #b23b30; color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
<script>
  // Applied before first paint, so a dark phone never flashes cream.
  (function () {
    try {
      var t = localStorage.getItem('standup-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode */ }
  })();
</script>
</head>
<body>

<div id="header">
  <span class="wordmark">standup</span>
  <button id="theme-btn" title="light / dark">◐</button>
</div>

<div id="weeknav">
  <button class="arrow" id="prev-btn" title="previous week">‹</button>
  <div id="week-face">
    <div id="week-name">…</div>
    <div id="week-sub">loading</div>
  </div>
  <button class="arrow" id="next-btn" title="next week">›</button>
</div>

<div id="tabs">
  <div class="tab active" data-view="log">log</div>
  <div class="tab" data-view="weekly">friday draft</div>
</div>

<main>
  <!-- ── LOG ── -->
  <section class="view active" id="view-log">
    <div class="panel" id="composer">
      <h2>what did you do?</h2>
      <textarea id="note" placeholder="shipped the deck agent, fixed the hardcoded IPs…"
                autocomplete="off"></textarea>
      <div class="stickers" id="pickers">
        <div class="sticker t-progress on" data-tag="progress">progress</div>
        <div class="sticker t-ai"          data-tag="ai">ai</div>
        <div class="sticker t-gap"         data-tag="gap">manual pain</div>
        <div class="sticker t-values"      data-tag="values">values</div>
        <div class="sticker t-next"        data-tag="next">next week</div>
      </div>
      <button class="primary" id="save-btn">log it</button>
      <div id="past-note">
        <span>lands on this week, not the one you're reading</span>
        <button class="quiet" id="jump-btn">go there</button>
      </div>
    </div>

    <div class="panel">
      <h2 id="entries-title">the week</h2>
      <div id="entries"><div class="empty">loading…</div></div>
    </div>
  </section>

  <!-- ── DRAFT ── -->
  <section class="view" id="view-weekly">
    <div class="panel wob">
      <h2>weekly update</h2>
      <div class="meta" id="draft-meta">…</div>
      <div id="draft-text" class="note">…</div>
      <div class="row" style="margin-top:14px">
        <button id="copy-btn">copy</button>
        <button id="regen-btn" class="quiet">regenerate</button>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
// The page is served behind ?token=, so reuse that token for every API call
// rather than embedding a secret in the markup.
const AUTH_TOKEN = new URLSearchParams(location.search).get('token') || '';

function apiUrl(path, params = {}) {
  const u = new URL(path, location.origin);
  u.searchParams.set('token', AUTH_TOKEN);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  return u.toString();
}

// ── STATE ──
// `week` is the ISO key both views are pinned to. It starts as whatever the URL
// asked for, or null to let the server resolve it (which is what makes a Monday
// land on the week that actually has notes in it).
const state = {
  week: new URLSearchParams(location.search).get('week') || null,
  meta: null,
  draftWeek: false,  // the week the draft pane shows; false = never loaded
};

let toastTimer = null;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('err', isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── THEME ──
const themeBtn = document.getElementById('theme-btn');
themeBtn.addEventListener('click', () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('standup-theme', next); } catch (e) { /* private mode */ }
});

// ── TABS ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchView(tab.dataset.view));
});

function switchView(name) {
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v =>
    v.classList.toggle('active', v.id === 'view-' + name));
  // Lazy, and re-fetched whenever the draft on screen is for a different week.
  if (name === 'weekly' && state.draftWeek !== state.week) loadDraft(false);
}

function weeklyVisible() {
  return document.getElementById('view-weekly').classList.contains('active');
}

// ── WEEK NAVIGATOR ──
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

function goToWeek(key) {
  if (!key) return;
  state.week = key;
  state.draftWeek = null;   // the draft pane is now stale
  loadEntries();
  if (weeklyVisible()) loadDraft(false);
}

prevBtn.addEventListener('click', () => goToWeek(state.meta && state.meta.prev_week));
nextBtn.addEventListener('click', () => goToWeek(state.meta && state.meta.next_week));
document.getElementById('jump-btn').addEventListener('click', () =>
  goToWeek(state.meta && state.meta.current_week));

// Monday 12:00 of the week containing `iso`, so week arithmetic can't be
// knocked off by a DST hour.
function mondayOf(iso) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}

function renderWeek(data) {
  const back = Math.round(
    (mondayOf(data.today) - mondayOf(data.week_start)) / 604800000);
  const name = back === 0 ? 'this week'
             : back === 1 ? 'last week'
             : back > 0   ? back + ' weeks ago'
             : 'ahead';

  document.getElementById('week-name').textContent = name;

  const notes = data.entry_count === 1 ? '1 note' : data.entry_count + ' notes';
  let sub = data.range + ' · ' + notes;
  // Say so out loud when the server picked the week, rather than quietly
  // showing one thing under a header that implies another.
  if (data.resolved === 'latest') sub = 'nothing logged this week yet · ' + sub;
  document.getElementById('week-sub').textContent = sub;

  prevBtn.disabled = !data.prev_week;
  nextBtn.disabled = !data.next_week;
  document.body.classList.toggle('past', !data.is_current);
  document.getElementById('entries-title').textContent =
    data.is_current ? 'the week' : 'that week';

  // Keep the URL honest so a reload or a shared link stays on this week.
  const u = new URL(location.href);
  u.searchParams.set('week', data.week);
  history.replaceState(null, '', u.toString());
}

// ── ENTRIES ──
const DAY_FMT = { weekday: 'long', month: 'short', day: 'numeric' };

async function loadEntries() {
  const box = document.getElementById('entries');
  try {
    const resp = await fetch(apiUrl('/standup/entries', state.week ? { week: state.week } : {}));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    state.meta = data;
    state.week = data.week;   // adopt whatever the server resolved to
    renderWeek(data);

    if (!data.entries.length) {
      box.innerHTML = '<div class="empty">' +
        (data.is_current ? 'nothing here yet — that&rsquo;s allowed.' : 'a quiet week.') +
        '</div>';
      return;
    }

    // Newest day first, so today is always at the top on mobile.
    const byDay = new Map();
    for (const e of data.entries) {
      const day = e.ts.slice(0, 10);
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(e);
    }

    let html = '';
    for (const day of [...byDay.keys()].sort().reverse()) {
      // Noon anchor, so the label can't slip a day across a timezone.
      const label = new Date(day + 'T12:00:00').toLocaleDateString(undefined, DAY_FMT);
      html += `<div class="day">${escapeHtml(label)}</div>`;
      for (const e of byDay.get(day).reverse()) {
        html += `<div class="entry">
          <div class="bubble">
            <div class="txt">${escapeHtml(e.text)}</div>
            <button class="del" data-id="${escapeHtml(e.id)}" title="delete">&times;</button>
          </div>
          <span class="sticker t-${escapeHtml(e.tag)}">${escapeHtml(e.tag)}</span>
        </div>`;
      }
    }
    box.innerHTML = html;
    box.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => removeEntry(btn.dataset.id));
    });
  } catch (e) {
    box.innerHTML = `<div class="empty">couldn&rsquo;t load: ${escapeHtml(e.message)}</div>`;
  }
}

// ── SAVE ──
let currentTag = 'progress';
document.querySelectorAll('#pickers .sticker').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#pickers .sticker').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    currentTag = chip.dataset.tag;
  });
});

const noteEl = document.getElementById('note');
const saveBtn = document.getElementById('save-btn');

async function saveEntry() {
  const text = noteEl.value.trim();
  if (!text) { toast('nothing to save', true); return; }
  saveBtn.disabled = true;
  try {
    const resp = await fetch(apiUrl('/standup/log'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, tag: currentTag }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    noteEl.value = '';
    toast('logged');
    // A note always lands on today, so show the week it landed in.
    state.week = state.meta ? state.meta.current_week : null;
    state.draftWeek = null;
    loadEntries();
  } catch (e) {
    toast('save failed: ' + e.message, true);
  } finally {
    saveBtn.disabled = false;
  }
}

saveBtn.addEventListener('click', saveEntry);
// Ctrl/Cmd+Enter saves without reaching for the button
noteEl.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') saveEntry();
});

async function removeEntry(id) {
  try {
    const resp = await fetch(apiUrl('/standup/delete'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    toast('deleted');
    state.draftWeek = null;
    loadEntries();
  } catch (e) {
    toast('delete failed', true);
  }
}

// ── DRAFT ──
const draftTextEl = document.getElementById('draft-text');
const draftMetaEl = document.getElementById('draft-meta');
const regenBtn = document.getElementById('regen-btn');
const copyBtn = document.getElementById('copy-btn');

function draftNote(msg) {
  draftTextEl.classList.add('note');
  draftTextEl.textContent = msg;
}

async function loadDraft(refresh) {
  regenBtn.disabled = true;
  copyBtn.disabled = true;
  draftNote(refresh ? 'writing it up…' : 'loading…');
  draftMetaEl.textContent = '';
  try {
    const params = {};
    if (state.week) params.week = state.week;
    if (refresh) params.refresh = 1;
    const resp = await fetch(apiUrl('/standup/weekly', params));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const d = await resp.json();
    state.draftWeek = d.week;

    if (d.status === 'empty') {
      draftNote('nothing was logged that week.');
      draftMetaEl.textContent = '';
      regenBtn.textContent = 'regenerate';
      return;
    }
    if (d.status === 'not-generated') {
      // Stepping back through history is free; building costs a model call.
      draftNote('no draft for this week yet.');
      draftMetaEl.innerHTML = `<b>${d.entry_count}</b> notes waiting`;
      regenBtn.textContent = 'build it';
      regenBtn.disabled = false;
      return;
    }

    draftTextEl.classList.remove('note');
    draftTextEl.textContent = d.text;
    draftMetaEl.innerHTML =
      `<b>${d.entry_count}</b> notes · via <b>${escapeHtml(String(d.generated_by))}</b>`;
    regenBtn.textContent = 'regenerate';
    regenBtn.disabled = false;
    copyBtn.disabled = false;
  } catch (e) {
    draftNote('couldn’t build it: ' + e.message);
    regenBtn.disabled = false;
  }
}

regenBtn.addEventListener('click', () => loadDraft(true));

copyBtn.addEventListener('click', async () => {
  const text = draftTextEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast('copied');
  } catch (e) {
    // Clipboard API needs a secure context; fall back to a manual selection.
    const range = document.createRange();
    range.selectNodeContents(draftTextEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast('selected — long-press to copy', true);
  }
});

// ── INIT ──
loadEntries();
if (location.hash === '#weekly') switchView('weekly');
</script>
</body>
</html>
