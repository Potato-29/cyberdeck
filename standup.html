<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STANDUP LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #060a10;
    --surface:  #0c131c;
    --border:   rgba(232,238,244,0.16);
    --border-bright: #e8eef4;
    --accent:   #1fe0ff;
    --accent-dim: rgba(31,224,255,0.35);
    --text:     #e8eef4;
    --dim:      #5a6a7c;
    --warn:     #ffb000;
    --danger:   #ff3b4e;
    --blue:     #1fe0ff;
    --violet:   #b98bff;
    --pink:     #ff7ecb;
    --header-h: 44px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      linear-gradient(rgba(31,224,255,0.03) 1px, transparent 1px) 0 0 / 100% 28px,
      var(--bg);
    color: var(--text);
    font-family: 'Chakra Petch', 'Share Tech Mono', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-text-size-adjust: 100%;
  }

  /* ── SCANLINES ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.10) 2px, rgba(0,0,0,0.10) 4px);
    pointer-events: none;
    z-index: 9999;
  }
  .scanline-flicker {
    position: fixed;
    inset: 0;
    background: rgba(31,224,255,0.02);
    pointer-events: none;
    z-index: 9998;
    animation: flicker 8s infinite;
  }
  @keyframes flicker {
    0%, 19.9%, 22%, 62.9%, 64%, 64.9%, 70%, 100% { opacity: 0; }
    20%, 21.9%, 63%, 63.9%, 65%, 69.9% { opacity: 0.05; }
  }

  /* ── HEADER ── */
  #header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 0 var(--accent-dim);
  }
  .status-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent), 0 0 12px var(--accent-dim);
    flex-shrink: 0;
  }
  .logo {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--text);
    text-transform: uppercase;
  }
  .logo::after {
    content: '_';
    animation: blink 1s infinite;
    color: var(--accent);
    text-shadow: 0 0 8px var(--accent);
  }
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  .week-label {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--accent);
  }

  /* ── TABS ── */
  #tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    user-select: none;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(31,224,255,0.06);
  }

  main { padding: 14px; max-width: 720px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  /* ── PANELS ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    padding: 14px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .panel::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 14px; height: 14px;
    border-top: 1px solid var(--accent);
    border-left: 1px solid var(--accent);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .panel:hover::after { opacity: 0.9; }
  .panel::before {
    content: attr(data-title);
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 8px;
    padding-left: 10px;
    border-bottom: 1px solid var(--border);
    border-left: 2px solid var(--accent);
  }

  /* ── FORM ── */
  textarea {
    width: 100%;
    min-height: 84px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 10px;
    resize: vertical;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
    box-shadow: 0 0 10px rgba(31,224,255,0.12);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip {
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 6px 10px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .chip.active {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-dim);
  }
  button {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  button:hover   { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(31,224,255,0.15); }
  button:active  { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: none; }
  button:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
  button.ghost { border-color: var(--border); color: var(--dim); }
  button.ghost:hover { border-color: var(--border-bright); color: var(--text); box-shadow: none; }

  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }

  /* ── ENTRIES ── */
  .day-head {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--dim);
    border-bottom: 1px dashed var(--border);
    padding: 10px 0 4px;
  }
  .entry {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 0;
    border-bottom: 1px solid rgba(232,238,244,0.08);
    font-size: 14px;
    line-height: 1.45;
  }
  .entry .tag {
    flex: none;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 2px 5px;
    border: 1px solid var(--border);
    color: var(--dim);
    margin-top: 2px;
  }
  .tag-progress { color: var(--accent) !important; border-color: var(--accent-dim) !important; }
  .tag-ai       { color: #00ccff !important;       border-color: rgba(0,204,255,0.35) !important; }
  .tag-gap      { color: var(--warn) !important;   border-color: rgba(255,176,0,0.35) !important; }
  .tag-values   { color: var(--pink) !important;   border-color: rgba(255,126,203,0.35) !important; }
  .tag-next     { color: var(--violet) !important; border-color: rgba(185,139,255,0.35) !important; }
  .entry .txt { flex: 1; word-break: break-word; }
  .entry .del {
    flex: none;
    color: var(--dim);
    cursor: pointer;
    padding: 0 4px;
    font-size: 14px;
  }
  .entry .del:active { color: var(--danger); }
  .empty { color: var(--dim); font-size: 13px; padding: 14px 0; text-align: center; }

  /* ── DRAFT ── */
  #draft-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.6;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 12px;
    max-height: 58vh;
    overflow-y: auto;
  }
  .meta { font-size: 11px; color: var(--dim); margin-bottom: 10px; }
  .meta b { color: var(--accent); font-weight: normal; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 10px 18px;
    font-size: 12px;
    letter-spacing: 1px;
    z-index: 500;
    transition: transform 0.25s ease;
    box-shadow: 0 0 20px rgba(31,224,255,0.15);
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<div class="scanline-flicker"></div>

<div id="header">
  <div class="status-dot"></div>
  <span class="logo">STANDUP LOG</span>
  <span class="week-label" id="week-label">--</span>
</div>

<div id="tabs">
  <div class="tab active" data-view="log">[ LOG ]</div>
  <div class="tab" data-view="weekly">[ FRIDAY DRAFT ]</div>
</div>

<main>
  <!-- ── LOG VIEW ── -->
  <section class="view active" id="view-log">
    <div class="panel" data-title="[ WHAT DID YOU DO? ]">
      <textarea id="note" placeholder="shipped the deck agent, fixed the hardcoded IPs..."
                autocomplete="off"></textarea>
      <div class="chips" id="chips">
        <div class="chip active" data-tag="progress">PROGRESS</div>
        <div class="chip" data-tag="ai">AI</div>
        <div class="chip" data-tag="gap">MANUAL PAIN</div>
        <div class="chip" data-tag="values">VALUES</div>
        <div class="chip" data-tag="next">NEXT WEEK</div>
      </div>
      <button id="save-btn">[ SAVE ENTRY ]</button>
    </div>

    <div class="panel" data-title="[ THIS WEEK ]">
      <div id="entries"><div class="empty">loading...</div></div>
    </div>
  </section>

  <!-- ── WEEKLY VIEW ── -->
  <section class="view" id="view-weekly">
    <div class="panel" data-title="[ WEEKLY UPDATE ]">
      <div class="meta" id="draft-meta">not generated yet</div>
      <div id="draft-text">Tap REGENERATE to build this week's draft.</div>
      <div class="row" style="margin-top:12px">
        <button id="copy-btn">[ COPY ]</button>
        <button id="regen-btn" class="ghost">[ REGENERATE ]</button>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
// The page is served behind ?token=, so reuse that token for every API call
// rather than embedding a secret in the markup.
const AUTH_TOKEN = new URLSearchParams(location.search).get('token') || '';

function apiUrl(path, params = {}) {
  const u = new URL(path, location.origin);
  u.searchParams.set('token', AUTH_TOKEN);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  return u.toString();
}

let toastTimer = null;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('err', isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── TABS ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchView(tab.dataset.view));
});

function switchView(name) {
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v =>
    v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'weekly' && !draftLoaded) loadDraft(false);
}

// ── TAG CHIPS ──
let currentTag = 'progress';
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentTag = chip.dataset.tag;
  });
});

// ── SAVE ──
const noteEl = document.getElementById('note');
const saveBtn = document.getElementById('save-btn');

async function saveEntry() {
  const text = noteEl.value.trim();
  if (!text) { toast('nothing to save', true); return; }
  saveBtn.disabled = true;
  try {
    const resp = await fetch(apiUrl('/standup/log'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, tag: currentTag }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    noteEl.value = '';
    toast('logged');
    loadEntries();
  } catch (e) {
    toast('save failed: ' + e.message, true);
  } finally {
    saveBtn.disabled = false;
  }
}

saveBtn.addEventListener('click', saveEntry);
// Ctrl/Cmd+Enter saves without reaching for the button
noteEl.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') saveEntry();
});

// ── ENTRIES ──
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const DAY_FMT = { weekday: 'long', month: 'short', day: 'numeric' };

async function loadEntries() {
  const box = document.getElementById('entries');
  try {
    const resp = await fetch(apiUrl('/standup/entries'));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    document.getElementById('week-label').textContent =
      'WEEK OF ' + data.week_start;

    if (!data.entries.length) {
      box.innerHTML = '<div class="empty">nothing logged yet this week</div>';
      return;
    }

    // Newest day first, so today is always at the top on mobile.
    const byDay = new Map();
    for (const e of data.entries) {
      const day = e.ts.slice(0, 10);
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(e);
    }

    let html = '';
    for (const day of [...byDay.keys()].sort().reverse()) {
      const label = new Date(day + 'T12:00:00').toLocaleDateString(undefined, DAY_FMT);
      html += `<div class="day-head">${label.toUpperCase()}</div>`;
      for (const e of byDay.get(day).reverse()) {
        html += `<div class="entry">
          <span class="tag tag-${e.tag}">${e.tag.toUpperCase()}</span>
          <span class="txt">${escapeHtml(e.text)}</span>
          <span class="del" data-id="${e.id}">&times;</span>
        </div>`;
      }
    }
    box.innerHTML = html;
    box.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => removeEntry(btn.dataset.id));
    });
  } catch (e) {
    box.innerHTML = `<div class="empty">load failed: ${escapeHtml(e.message)}</div>`;
  }
}

async function removeEntry(id) {
  try {
    const resp = await fetch(apiUrl('/standup/delete'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    toast('deleted');
    loadEntries();
  } catch (e) {
    toast('delete failed', true);
  }
}

// ── DRAFT ──
let draftLoaded = false;
const draftTextEl = document.getElementById('draft-text');
const regenBtn = document.getElementById('regen-btn');

async function loadDraft(refresh) {
  regenBtn.disabled = true;
  draftTextEl.textContent = refresh ? 'generating...' : 'loading...';
  try {
    const resp = await fetch(apiUrl('/standup/weekly', refresh ? { refresh: 1 } : {}));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const d = await resp.json();
    draftTextEl.textContent = d.text;
    document.getElementById('draft-meta').innerHTML =
      `week of <b>${d.week_start}</b> &middot; <b>${d.entry_count}</b> entries &middot; ` +
      `via <b>${d.generated_by}</b>`;
    draftLoaded = true;
  } catch (e) {
    draftTextEl.textContent = 'generation failed: ' + e.message;
  } finally {
    regenBtn.disabled = false;
  }
}

regenBtn.addEventListener('click', () => loadDraft(true));

document.getElementById('copy-btn').addEventListener('click', async () => {
  const text = draftTextEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast('copied to clipboard');
  } catch (e) {
    // Clipboard API needs a secure context; fall back to a manual selection.
    const range = document.createRange();
    range.selectNodeContents(draftTextEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast('selected — long-press to copy', true);
  }
});

// ── INIT ──
loadEntries();
if (location.hash === '#weekly') switchView('weekly');
</script>
</body>
</html>
