<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORK // LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Palette lifted from dashboard.html so the work tab reads as the same deck. */
  :root {
    --bg:       #060a10;
    --surface:  #0c131c;
    --border:   rgba(232,238,244,0.16);
    --accent:   #1fe0ff;
    --accent-dim: rgba(31,224,255,0.35);
    --text:     #e8eef4;
    --dim:      #5a6a7c;
    --warn:     #ffb000;
    --danger:   #ff3b4e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px 14px 80px;
    background:
      linear-gradient(rgba(31,224,255,0.03) 1px, transparent 1px) 0 0 / 100% 28px,
      var(--bg);
    color: var(--text);
    font-family: 'Chakra Petch', 'Share Tech Mono', sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  /* CRT scanlines. pointer-events:none so it never eats a tap. */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.10) 2px, rgba(0,0,0,0.10) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  #app { max-width: 760px; margin: 0 auto; }

  /* ── header ── */
  header {
    display: flex; align-items: baseline; gap: 10px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .logo { font-weight: 700; letter-spacing: 2px; font-size: 15px; }
  .logo::after {
    content: '_'; color: var(--accent);
    text-shadow: 0 0 8px var(--accent);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .hdr-stat {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; color: var(--dim); letter-spacing: 1px;
  }
  .hdr-stat b { color: var(--accent); font-weight: 400; }
  .hdr-spacer { flex: 1; }

  /* ── panels ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px 14px;
    margin-bottom: 14px;
    position: relative;
    clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }
  .panel::before {
    content: attr(data-title);
    display: block;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    padding: 0 0 6px 8px;
    margin: 0 0 12px -14px;
  }

  /* ── capture ── */
  textarea#capture {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    background: #070c12;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 12px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 16px;   /* 16px+ stops iOS zooming the page on focus */
    line-height: 1.45;
  }
  textarea#capture:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim), 0 0 18px rgba(31,224,255,0.10);
  }
  textarea#capture::placeholder { color: var(--dim); }
  /* A pasted stack trace stays one note, so it must render as one block. */
  textarea#capture.is-pre {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    white-space: pre;
    overflow-x: auto;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: 1px;
    background: transparent; color: var(--dim);
    border: 1px solid var(--border);
    padding: 9px 12px;          /* big tap target */
    cursor: pointer;
    clip-path: polygon(0 6px, 6px 0, 100% 0, 100% 100%, 0 100%);
  }
  .chip:hover { color: var(--text); border-color: var(--accent-dim); }
  .chip.active {
    color: var(--accent); border-color: var(--accent);
    background: rgba(31,224,255,0.08);
  }
  .chip .num { color: var(--dim); margin-right: 5px; }
  .chip.active .num { color: var(--accent-dim); }

  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  button.btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 10px 16px; cursor: pointer;
    clip-path: polygon(0 6px, 6px 0, 100% 0, 100% 100%, 0 100%);
  }
  button.btn:hover { background: rgba(31,224,255,0.10); border-color: var(--accent); }
  button.btn.quiet { color: var(--dim); border-color: var(--border); }
  button.btn.quiet:hover { color: var(--text); background: rgba(232,238,244,0.05); }
  button.btn:disabled { opacity: 0.4; cursor: default; }
  .hint {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: var(--dim); letter-spacing: 0.5px;
  }

  /* ── note list ── */
  .note {
    display: flex; gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dashed rgba(232,238,244,0.08);
  }
  .note:last-child { border-bottom: none; }
  .note-ts {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; color: var(--dim);
    flex: 0 0 46px; padding-top: 2px;
  }
  .note-body { flex: 1; min-width: 0; }
  .note-text { word-wrap: break-word; overflow-wrap: anywhere; }
  /* Multi-line notes are almost always pasted traces — keep them readable. */
  .note-text.pre {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    background: #070c12;
    border-left: 2px solid var(--border);
    padding: 6px 8px;
    overflow-x: auto;
  }
  .note-meta {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: var(--dim);
    margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .tag { color: var(--accent-dim); }
  .note.pending .note-text { color: var(--dim); font-style: italic; }
  .note.failed .note-text { color: var(--warn); }
  .note-actions { display: flex; gap: 6px; }
  .mini {
    background: none; border: none; cursor: pointer;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    color: var(--dim); padding: 4px 6px;
  }
  .mini:hover { color: var(--accent); }
  .mini.danger:hover { color: var(--danger); }
  .empty { color: var(--dim); font-size: 13px; font-style: italic; }

  /* ── context cards ── */
  .ctx-card {
    border: 1px solid var(--border);
    padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer;
    clip-path: polygon(0 6px, 6px 0, 100% 0, 100% 100%, 0 100%);
  }
  .ctx-card:hover { border-color: var(--accent-dim); }
  .ctx-card.active { border-color: var(--accent); background: rgba(31,224,255,0.05); }
  .ctx-head { display: flex; align-items: baseline; gap: 8px; }
  .ctx-name { font-weight: 600; letter-spacing: 1px; }
  .ctx-card.active .ctx-name { color: var(--accent); }
  .ctx-count {
    font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--dim);
    margin-left: auto;
  }
  .ctx-crumb {
    font-size: 12.5px; color: var(--dim); margin-top: 4px;
    border-left: 2px solid var(--border); padding-left: 8px;
  }
  .ctx-crumb b { color: var(--warn); font-weight: 400; letter-spacing: 1px; font-size: 11px;
                 font-family: 'Share Tech Mono', monospace; }

  input.search {
    width: 100%; background: #070c12; color: var(--text);
    border: 1px solid var(--border); padding: 10px 12px;
    font-family: 'Share Tech Mono', monospace; font-size: 16px;
  }
  input.search:focus { outline: none; border-color: var(--accent); }
  mark { background: rgba(31,224,255,0.22); color: var(--accent); }

  /* ── friday ── */
  .sec { margin-bottom: 14px; }
  .sec-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 2px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 5px;
  }
  .sec textarea {
    width: 100%; min-height: 70px; resize: vertical;
    background: #070c12; color: var(--text);
    border: 1px solid var(--border); padding: 8px 10px;
    font-family: 'Share Tech Mono', monospace; font-size: 13px; line-height: 1.5;
  }
  .sec textarea:focus { outline: none; border-color: var(--accent-dim); }
  #friday-body { display: none; }
  .gen-meta { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--dim); }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 1px;
    padding: 9px 16px; z-index: 10000;
    opacity: 0; pointer-events: none; transition: opacity 0.18s;
    clip-path: polygon(0 6px, 6px 0, 100% 0, 100% 100%, 0 100%);
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--danger); color: var(--danger); }

  @media (max-width: 480px) {
    body { padding: 12px 10px 70px; }
    .note-ts { flex-basis: 42px; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <span class="logo">WORK//LOG</span>
    <span class="hdr-spacer"></span>
    <span class="hdr-stat">CTX <b id="hdr-ctx">—</b></span>
    <span class="hdr-stat">TODAY <b id="hdr-count">0</b></span>
    <span class="hdr-stat" id="hdr-elapsed"></span>
  </header>

  <section class="panel" data-title="[ CAPTURE ]">
    <textarea id="capture" placeholder="what just happened?" autofocus
              autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn" id="log-btn">Log it</button>
      <button class="btn quiet" id="crumb-btn" title="Record where you stopped">Breadcrumb</button>
      <span class="hint">enter logs &middot; shift+enter newline</span>
    </div>
  </section>

  <section class="panel" data-title="[ TODAY ]">
    <div id="today-list"><div class="empty">nothing logged yet today.</div></div>
  </section>

  <section class="panel" data-title="[ CONTEXTS ]">
    <div id="ctx-list"></div>
  </section>

  <section class="panel" data-title="[ SEARCH ]">
    <input class="search" id="search" type="search" placeholder="search every note  ( / )"
           autocomplete="off" spellcheck="false">
    <div id="search-results"></div>
  </section>

  <section class="panel" data-title="[ FRIDAY ]">
    <div class="row" style="margin-top:0">
      <button class="btn" id="draft-btn">Assemble draft</button>
      <button class="btn quiet" id="regen-btn" style="display:none">Regenerate</button>
      <span class="gen-meta" id="gen-meta"></span>
    </div>
    <div id="friday-body">
      <div id="sections"></div>
      <div class="row">
        <button class="btn" id="copy-btn">Copy for Slack</button>
        <span class="hint">edit a section, then copy. notes are never rewritten.</span>
      </div>
    </div>
  </section>

</div>
<div id="toast"></div>

<script>
// The page is served behind ?token=, so reuse that token for every subsequent
// API call rather than embedding a secret in the markup.
const AUTH_TOKEN = new URLSearchParams(location.search).get('token') || '';

function apiUrl(path, params = {}) {
  const u = new URL(path, location.origin);
  u.searchParams.set('token', AUTH_TOKEN);
  for (const [k, v] of Object.entries(params)) {
    if (v !== null && v !== undefined && v !== '') u.searchParams.set(k, v);
  }
  return u.toString();
}

async function api(path, { method = 'GET', body = null, params = {} } = {}) {
  const opts = { method };
  if (body) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(apiUrl(path, params), opts);
  if (resp.status === 204) return null;
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
  return data;
}

let toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2200);
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const hhmm = (iso) => (iso || '').slice(11, 16);
const todayStr = () => {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

// ── state ────────────────────────────────────────────────
let contexts = [];
let activeCtx = null;
let todayNotes = [];
let sectionMeta = [];
let pollTimer = null;

// ── capture ──────────────────────────────────────────────
const capture = document.getElementById('capture');

// A pasted stack trace is one thing you will later want to find as one thing,
// so it is never split on newlines — only rendered monospace.
capture.addEventListener('input', () => {
  capture.classList.toggle('is-pre', capture.value.includes('\n'));
});

capture.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitNote(); }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitNote(); }
});

async function submitNote() {
  const text = capture.value.trim();
  if (!text) return;
  capture.value = '';
  capture.classList.remove('is-pre');
  try {
    await api('/api/notes', { method: 'POST', body: { text, context_id: activeCtx } });
    await Promise.all([loadToday(), loadContexts()]);
  } catch (err) {
    capture.value = text;   // never silently swallow what was typed
    toast(err.message, true);
  }
}

async function submitBreadcrumb() {
  if (!activeCtx) return toast('no active context', true);
  const text = capture.value.trim();
  try {
    await api(`/api/contexts/${activeCtx}/breadcrumb`, { method: 'POST', body: { text } });
    capture.value = '';
    capture.classList.remove('is-pre');
    toast('breadcrumb dropped');
    await loadContexts();
  } catch (err) { toast(err.message, true); }
}

document.getElementById('log-btn').onclick = submitNote;
document.getElementById('crumb-btn').onclick = submitBreadcrumb;

// ── contexts ─────────────────────────────────────────────
async function loadContexts() {
  const data = await api('/api/contexts');
  contexts = data.contexts;
  activeCtx = data.active_context_id;
  renderChips();
  renderContexts();
}

function renderChips() {
  document.getElementById('chips').innerHTML = contexts.map((c, i) => `
    <button class="chip ${c.id === activeCtx ? 'active' : ''}" data-id="${c.id}">
      <span class="num">${i + 1}</span>${esc(c.name)}
    </button>`).join('');
  document.querySelectorAll('.chip').forEach((el) => {
    el.onclick = () => switchContext(Number(el.dataset.id));
  });
}

function renderContexts() {
  document.getElementById('ctx-list').innerHTML = contexts.map((c) => {
    const crumb = c.last_breadcrumb;
    return `<div class="ctx-card ${c.id === activeCtx ? 'active' : ''}" data-id="${c.id}">
      <div class="ctx-head">
        <span class="ctx-name">${esc(c.name)}</span>
        <span class="ctx-count">${c.note_count} note${c.note_count === 1 ? '' : 's'}</span>
      </div>
      ${crumb ? `<div class="ctx-crumb"><b>WHERE I STOPPED</b><br>${esc(crumb.text)}</div>` : ''}
    </div>`;
  }).join('');
  document.querySelectorAll('.ctx-card').forEach((el) => {
    el.onclick = () => switchContext(Number(el.dataset.id));
  });
}

async function switchContext(id) {
  try {
    await api(`/api/contexts/${id}/switch`, { method: 'POST' });
    activeCtx = id;
    await Promise.all([loadContexts(), loadToday(), loadStatus()]);
    capture.focus();
  } catch (err) { toast(err.message, true); }
}

// ── today ────────────────────────────────────────────────
async function loadToday() {
  const data = await api('/api/notes', { params: { date: todayStr() } });
  todayNotes = data.notes;
  renderToday();
  // Only poll while something is mid-transcription.
  const pending = todayNotes.some((n) => n.status === 'pending');
  if (pending && !pollTimer) pollTimer = setInterval(loadToday, 3000);
  if (!pending && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function noteHtml(n) {
  const multi = n.raw_text.includes('\n');
  const text = n.status === 'pending' ? 'transcribing…' : n.raw_text;
  return `<div class="note ${n.status}" data-id="${n.id}">
    <div class="note-ts">${hhmm(n.timestamp)}</div>
    <div class="note-body">
      <div class="note-text ${multi ? 'pre' : ''}">${esc(text)}</div>
      <div class="note-meta">
        <span class="tag">${esc(n.context_name || 'unfiled')}</span>
        <span>${esc(n.source)}</span>
        ${n.status === 'failed' ? '<span style="color:var(--warn)">transcription failed</span>' : ''}
        <span class="note-actions">
          ${n.status === 'failed' ? `<button class="mini" data-act="retry">retry</button>` : ''}
          <button class="mini" data-act="edit">edit</button>
          <button class="mini danger" data-act="del">del</button>
        </span>
      </div>
    </div>
  </div>`;
}

function renderToday() {
  const el = document.getElementById('today-list');
  if (!todayNotes.length) {
    el.innerHTML = '<div class="empty">nothing logged yet today.</div>';
    return;
  }
  el.innerHTML = todayNotes.map(noteHtml).join('');
  el.querySelectorAll('.mini').forEach((btn) => {
    btn.onclick = () => {
      const id = Number(btn.closest('.note').dataset.id);
      const act = btn.dataset.act;
      if (act === 'del') return deleteNote(id);
      if (act === 'edit') return editNote(id);
      if (act === 'retry') return retryNote(id);
    };
  });
}

async function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  try {
    await api(`/api/notes/${id}`, { method: 'DELETE' });
    await Promise.all([loadToday(), loadContexts(), loadStatus()]);
  } catch (err) { toast(err.message, true); }
}

async function editNote(id) {
  const note = todayNotes.find((n) => n.id === id);
  const next = prompt('Edit note', note ? note.raw_text : '');
  if (next === null || !next.trim()) return;
  try {
    await api(`/api/notes/${id}`, { method: 'PATCH', body: { text: next } });
    await loadToday();
  } catch (err) { toast(err.message, true); }
}

async function retryNote(id) {
  try {
    await api(`/api/notes/${id}/retranscribe`, { method: 'POST' });
    toast('retranscribing…');
    await loadToday();
  } catch (err) { toast(err.message, true); }
}

// ── status header ────────────────────────────────────────
async function loadStatus() {
  try {
    const s = await api('/api/today');
    document.getElementById('hdr-ctx').textContent = s.active_context ? s.active_context.name : '—';
    document.getElementById('hdr-count').textContent = s.note_count;
    const mins = s.elapsed_s === null ? null : Math.floor(s.elapsed_s / 60);
    document.getElementById('hdr-elapsed').innerHTML =
      mins === null ? '' : `FOR <b>${mins < 60 ? mins + 'm' : Math.floor(mins / 60) + 'h' + (mins % 60) + 'm'}</b>`;
  } catch { /* header is ambient; a blip should not surface an error */ }
}

// ── search ───────────────────────────────────────────────
const searchInput = document.getElementById('search');
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 180);
});

async function runSearch() {
  const q = searchInput.value.trim();
  const el = document.getElementById('search-results');
  if (!q) { el.innerHTML = ''; return; }
  try {
    const data = await api('/api/search', { params: { q } });
    if (!data.results.length) { el.innerHTML = '<div class="empty">no matches.</div>'; return; }
    el.innerHTML = data.results.map((r) => `
      <div class="note">
        <div class="note-ts">${(r.timestamp || '').slice(5, 10)}</div>
        <div class="note-body">
          <!-- Escape first, then swap the control-char delimiters the server
               wrapped the matches in, so highlighting can never inject markup. -->
          <div class="note-text">${esc(r.snippet || r.raw_text)
            .replace(/\u0002/g, '<mark>').replace(/\u0003/g, '</mark>')}</div>
          <div class="note-meta"><span class="tag">${esc(r.context_name || 'unfiled')}</span>
            <span>${(r.timestamp || '').slice(0, 10)}</span></div>
        </div>
      </div>`).join('');
  } catch (err) { toast(err.message, true); }
}

// ── friday ───────────────────────────────────────────────
async function loadDraft(refresh = false) {
  const btn = document.getElementById('draft-btn');
  btn.disabled = true;
  btn.textContent = refresh ? 'Regenerating…' : 'Assembling…';
  try {
    const d = await api('/api/friday/draft', { params: refresh ? { refresh: '1' } : {} });
    sectionMeta = d.section_meta;
    document.getElementById('sections').innerHTML = sectionMeta.map((s) => `
      <div class="sec">
        <div class="sec-label">${esc(s.label)}</div>
        <textarea data-key="${s.key}">${esc(d.sections[s.key] || '')}</textarea>
      </div>`).join('');
    document.getElementById('gen-meta').textContent =
      `${d.week} · ${d.note_count} notes · ${d.crumb_count} threads · via ${d.generated_by}`;
    document.getElementById('friday-body').style.display = 'block';
    document.getElementById('regen-btn').style.display = '';
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Assemble draft';
  }
}

document.getElementById('draft-btn').onclick = () => loadDraft(false);
document.getElementById('regen-btn').onclick = () => loadDraft(true);

document.getElementById('copy-btn').onclick = async () => {
  const sections = {};
  document.querySelectorAll('#sections textarea').forEach((t) => {
    sections[t.dataset.key] = t.value;
  });
  try {
    const res = await api('/api/friday/approve', { method: 'POST', body: { sections } });
    await navigator.clipboard.writeText(res.rendered);
    toast('copied — paste into Slack');
  } catch (err) {
    toast('could not copy: ' + err.message, true);
  }
};

// ── keyboard ─────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  const typing = ['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName);

  if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); return; }
  if (e.key === 'Escape') {
    searchInput.blur();
    capture.focus();
    return;
  }
  // 1-9 jumps context, but only when not mid-sentence.
  if (!typing && /^[1-9]$/.test(e.key)) {
    const ctx = contexts[Number(e.key) - 1];
    if (ctx) { e.preventDefault(); switchContext(ctx.id); }
  }
});

// ── boot ─────────────────────────────────────────────────
(async function init() {
  try {
    await loadContexts();
    await loadToday();
    await loadStatus();
  } catch (err) {
    toast('could not reach the log: ' + err.message, true);
  }
  capture.focus();
  setInterval(loadStatus, 60000);
})();
</script>
